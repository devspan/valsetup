services:
  rupaya-node:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - chaindata:/root/.ethereum
      - ./genesis.json:/root/genesis.json
      - ./config.toml:/root/.ethereum/config.toml
    ports:
      - "8545:8545"    # Standard HTTP port
      - "8546:8546"    # Standard WebSocket port
      - "30303:30303"  # Standard P2P port
    environment:
      - NETWORK_ID
      - SYNCMODE
      - GCMODE
      - HTTP_API
      - WS_API
      - BOOTNODES
      - MINER_ETHERBASE
      - VERBOSITY
      - IMPORT_PRIVATE_KEY
    secrets:
      - node_password
      - node_private_key
    entrypoint: /entrypoint.sh

volumes:
  chaindata:

secrets:
  node_password:
    file: ./password.txt
  node_private_key:
    file: ./private_key.txt