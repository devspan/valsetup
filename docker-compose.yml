services:
  rupaya-node:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - chaindata:/root/.ethereum
      - ./genesis.json:/root/genesis.json
      - ./config.toml:/root/.ethereum/config.toml
    ports:
      - "127.0.0.1:8545:8545"    # Only accessible from VPS localhost
      - "127.0.0.1:8546:8546"    # Only accessible from VPS localhost
      - "30303:30303"            # P2P remains publicly accessible
    environment:
      - NETWORK_ID
      - SYNCMODE
      - GCMODE
      - HTTP_API
      - WS_API
      - BOOTNODES
      - MINER_ETHERBASE
      - VERBOSITY
      - IMPORT_PRIVATE_KEY
    secrets:
      - node_password
      - node_private_key
    entrypoint: /entrypoint.sh

volumes:
  chaindata:

secrets:
  node_password:
    file: ./password.txt
  node_private_key:
    file: ./private_key.txt